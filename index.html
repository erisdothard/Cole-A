<!doctype html>
<html lang="en" data-fx="full">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CVZ-TV</title>
<meta name="description" content="CVZ — Cole Anderson. Visual design, brand enhancement, video, merch. Nashville. Turn the set on." />
<meta name="theme-color" content="#050505" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Anton&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- THE SET. A mid-90s TV on its VCR, RCA cables plugged in, in a dim den. Photographed; the glass, the tape slot and six buttons are live on top of it. -->
  <div id="room" class="room">
    <div id="room-dark" class="room-dark" aria-hidden="true"></div>
    <div id="set" class="set">
      <div class="set__glow" aria-hidden="true"></div>
      <div class="stand" aria-hidden="true"></div>
      <img class="set__photo" src="/tv/stack3.webp" width="932" height="960" alt="" draggable="false" fetchpriority="high" decoding="async" />
      <div id="glass" class="glass"><div id="tube-off" class="tube-off"></div><video id="glass-feed" class="glass-feed" muted playsinline loop preload="auto"></video><div id="glass-dim" class="glass-dim"></div><div id="glass-bloom" class="glass-bloom"></div><div id="glass-say" class="glass-say" hidden></div></div>
      <button class="badge" id="power" type="button" aria-label="Power up"><b>CVZ</b><span>⏻ POWER</span></button>
      <div id="slot" class="slot" aria-hidden="true"><i class="slot__tape"></i></div>
      <span class="set__led" id="led" aria-hidden="true"></span>
      <button class="sbtn" data-btn="vol-dn" type="button" aria-label="Volume down"><span>−</span><em class="sbtn__group">VOL</em></button>
      <button class="sbtn" data-btn="vol-up" type="button" aria-label="Volume up"><span>+</span></button>
      <button class="sbtn" data-btn="ch-dn" type="button" aria-label="Previous tape"><span>▼</span><em class="sbtn__group">CH</em></button>
      <button class="sbtn" data-btn="ch-up" type="button" aria-label="Next tape"><span>▲</span></button>
      <button class="sbtn" data-btn="eject" type="button" aria-label="Eject"><span>EJECT</span></button>
      <button class="sbtn sbtn--power" data-btn="power" type="button" aria-label="Power up"><span>POWER</span></button>
    </div>
    <!-- THE SHELF. Next to the set once it is on: a pile of five VHS tapes. -->
    <section id="shelf" class="shelf" hidden aria-label="Tapes">
      <div class="shelf__head"><span id="shelf-say">INSERT TAPE</span></div>
      <div class="shelf__row" id="shelf-row" role="listbox" aria-label="Select a tape"></div>
    </section>
    <div class="room__logo" aria-hidden="true">CVZ</div>
    <p class="room__name">COLE ANDERSON <i>·</i> VISUAL DESIGN <i>·</i> CHICAGO – NASHVILLE</p>
    <div class="roomvol" role="group" aria-label="Volume">
      <button id="room-mute" class="roomvol__mute" type="button" aria-pressed="true">STATIC ON</button>
      <span class="roomvol__label">VOL</span><span class="vbar" id="room-vbar" aria-hidden="true"></span><b id="room-vol-n" aria-live="polite">05</b>
    </div>
  </div>

  <!-- INSIDE THE TUBE. Everything after POWER lives here. -->
  <main id="tube" class="tube" hidden>
    <div class="tube__inner">
      <video id="feed" class="feed" muted playsinline loop preload="auto"></video>
      <div class="feed-fx" aria-hidden="true"><div class="tracking"></div><div class="tracking tracking--2"></div></div>
      <div id="objects" class="objects"></div>
      <div id="spam" class="spam" aria-live="polite"></div>

      <div class="osd osd--tl" id="osd-tl"><span id="osd-mode">PLAY ▶</span> <span id="osd-tc">SP 0:00:00</span></div>
      <div class="osd osd--tr" id="osd-ch"><span id="osd-num">NO TAPE</span><span id="osd-name">CVZ-TV</span><span id="osd-where"></span></div>
      <div class="osd osd--br" id="osd-help"></div>
      <div class="osd osd--vol" id="osd-vol" hidden aria-live="polite"><span>VOL</span><span class="vbar" id="osd-vol-bar" aria-hidden="true"></span><span id="osd-vol-n"></span></div>
      <div class="osd osd--bl" id="osd-hover" hidden>▶ SELECT</div>

      <section id="lock" class="lock" hidden>
        <div class="lock__media" id="lock-media"></div>
        <div class="chyron" id="chyron"><div class="chyron__bar"><b id="lk-title"></b><span id="lk-note"></span></div><div class="chyron__meta"><span id="lk-count"></span><span>◀ ▶ NEXT · ESC BACK</span></div></div>
        <div class="osd osd--tl">PAUSE ‖ <span id="lk-tc"></span></div>
      </section>

      <!-- THE INDEX. Every folder and piece on the tape that is in. -->
      <section id="index" class="index" hidden aria-label="Index">
        <div class="index__head"><span id="index-title"></span><span>M · ESC TO CLOSE</span></div>
        <div class="index__body"><div class="index__tree" id="index-tree"></div><div class="index__view" id="index-view"></div></div>
      </section>

      <div id="static" class="static" aria-hidden="true"><canvas id="snow"></canvas></div>
    </div>
    <div class="tube__glass" aria-hidden="true"></div>
    <nav class="nav" aria-label="Browse">
      <button id="prev-btn" class="nav-btn" type="button">◀ PREV</button>
      <button id="index-btn" class="nav-btn" type="button">INDEX</button>
      <button id="next-btn" class="nav-btn" type="button">NEXT ▶</button>
      <button id="eject-btn" class="nav-btn nav-btn--eject" type="button">⏏ EJECT</button>
    </nav>
    <div class="volctl" role="group" aria-label="Volume">
      <button id="vol-dn" class="ctl" type="button" aria-label="Volume down">VOL −</button>
      <button id="vol-up" class="ctl" type="button" aria-label="Volume up">VOL +</button>
      <button id="mute-btn" class="ctl" type="button" aria-pressed="true">STATIC ON</button>
    </div>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
