<!doctype html>
<html lang="en" data-fx="full">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CVZ-TV</title>
<meta name="description" content="CVZ — Cole Anderson. Visual design, brand enhancement, video, merch. Nashville. Turn the set on." />
<meta name="theme-color" content="#050505" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Anton&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- THE SET. A real television in a dark room. Photo cabinet; the glass, dial, knobs and POWER are live on top of it. -->
  <div id="room" class="room">
    <div id="set" class="set">
      <img class="set__photo" src="/tv/cabinet-a.webp" width="1107" height="663" alt="" draggable="false" fetchpriority="high" decoding="async" />
      <div id="glass" class="glass"><div id="tube-off" class="tube-off"></div></div>
      <div class="plate"><span>CVZ</span></div>
      <div id="dial" class="dial" aria-label="Channel">
        <div class="dial__face">
          <i class="dial__n" style="--a:-150deg"><b>1</b></i><i class="dial__n" style="--a:-100deg"><b>2</b></i><i class="dial__n" style="--a:-50deg"><b>3</b></i><i class="dial__n" style="--a:0deg"><b>4</b></i><i class="dial__n" style="--a:50deg"><b>5</b></i><i class="dial__n" style="--a:100deg"><b>6</b></i><i class="dial__n" style="--a:150deg"><b>7</b></i>
        </div>
        <div class="dial__cap"></div>
      </div>
      <div id="k-bright" class="knob knob--1"><div class="knob__cap"></div></div>
      <div id="k-vhold" class="knob knob--2"><div class="knob__cap"></div></div>
      <div id="k-vol" class="knob knob--3"><div class="knob__cap"></div></div>
      <div class="legend" aria-hidden="true"><span>BRIGHT</span><span>V-HOLD</span><span>VOL</span></div>
      <button id="power" class="power" type="button" aria-label="Power up"><span class="power__led" id="led"></span><span class="power__cap">POWER</span></button>
    </div>
    <button id="switch-set" class="switch" type="button" aria-label="Switch to another television set"><span>SWITCH SET</span><b id="switch-name"></b><i id="switch-n"></i></button>
  </div>

  <!-- INSIDE THE TUBE. Everything after POWER lives here. -->
  <main id="tube" class="tube" hidden>
    <div class="tube__inner">
      <video id="feed" class="feed" muted playsinline loop preload="auto"></video>
      <div class="feed-fx" aria-hidden="true"><div class="tracking"></div><div class="tracking tracking--2"></div></div>
      <div id="objects" class="objects"></div>
      <div id="spam" class="spam" aria-live="polite"></div>

      <div class="osd osd--tl" id="osd-tl"><span id="osd-mode">PLAY ▶</span> <span id="osd-tc">SP 0:00:00</span></div>
      <div class="osd osd--tr" id="osd-ch"><span id="osd-num">CH 1</span><span id="osd-name">CVZ</span></div>
      <div class="osd osd--br" id="osd-help">◀▶ NEXT · ▲▼ CH · +− VOL · ESC</div>
      <div class="osd osd--vol" id="osd-vol" hidden aria-live="polite"><span>VOL</span><span class="vbar" id="osd-vol-bar" aria-hidden="true"></span><span id="osd-vol-n"></span></div>
      <div class="osd osd--bl" id="osd-hover" hidden>▶ SELECT</div>

      <section id="lock" class="lock" hidden>
        <div class="lock__media" id="lock-media"></div>
        <div class="chyron" id="chyron"><div class="chyron__bar"><b id="lk-title"></b><span id="lk-note"></span></div><div class="chyron__meta"><span id="lk-count"></span><span>ESC · BACK</span></div></div>
        <div class="osd osd--tl">PAUSE ‖ <span id="lk-tc"></span></div>
      </section>

      <section id="menu" class="menu" hidden aria-label="Index">
        <div class="menu__head"><span>CVZ-TV · MENU</span><span>EVERYTHING ON THE SET · ESC TO CLOSE</span></div>
        <div class="menu__cols" id="menu-cols"></div>
      </section>

      <div id="static" class="static" aria-hidden="true"><canvas id="snow"></canvas></div>
    </div>
    <div class="tube__glass" aria-hidden="true"></div>
    <nav class="nav" aria-label="Browse">
      <button id="prev-btn" class="nav-btn" type="button">◀ PREV</button>
      <button id="menu-btn" class="nav-btn" type="button">MENU</button>
      <button id="next-btn" class="nav-btn" type="button">NEXT ▶</button>
    </nav>
    <div class="volctl" role="group" aria-label="Volume">
      <button id="vol-dn" class="ctl" type="button" aria-label="Volume down">VOL −</button>
      <button id="vol-up" class="ctl" type="button" aria-label="Volume up">VOL +</button>
      <button id="mute-btn" class="ctl" type="button" aria-pressed="false">MUTE</button>
    </div>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
